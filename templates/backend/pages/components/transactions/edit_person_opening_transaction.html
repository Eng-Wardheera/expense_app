{% extends 'backend/home/base.html' %}


{% block title %}
Edit Person Opening Transaction
{% endblock %}



{% block content %}

 <!-- [ page-header ] start -->
<div class="page-header">
    <div class="page-header-left d-flex align-items-center">
        <div class="page-header-title">
            <h5 class="m-b-10">Opening Transactions</h5>
        </div>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item">Edit Opening Transactions </li>
        </ul>
    </div>
    <div class="page-header-right ms-auto">
        <div class="page-header-right-items">
            <div class="d-flex d-md-none">
                <a href="javascript:void(0)" class="page-header-right-close-toggle">
                    <i class="feather-arrow-left me-2"></i>
                    <span>Back</span>
                </a>
            </div>
            <div class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                <a href="javascript:void(0);" class="btn btn-icon btn-light-brand" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    <i class="feather-bar-chart"></i>
                </a>
              
                
                <a href="leads-create.html" class="btn btn-primary">
                    <i class="feather-plus me-2"></i>
                    <span>Create Lead</span>
                </a>
            </div>
        </div>
        <div class="d-md-none d-flex align-items-center">
            <a href="javascript:void(0)" class="page-header-right-open-toggle">
                <i class="feather-align-right fs-20"></i>
            </a>
        </div>
    </div>
</div>


<div class="main-content mt-4">

<div class="row">
    <div class="card shadow-sm">


    <!-- HEADER -->

    <div class="card-header bg-white py-3">


        <div class="d-flex justify-content-between align-items-center">


            <h5 class="mb-0 fw-bold">

                Edit Person Opening Transaction

            </h5>



            <a href="{{ url_for('main.person_opening_transactions') }}"
               class="btn btn-secondary btn-sm">

                <i class="bi bi-arrow-left"></i>

                Back

            </a>



        </div>


    </div>





    <!-- FORM -->


    <div class="card-body">


        <form method="POST">



            <!-- PERSON NAME -->

            <div class="mb-3">


                <label class="form-label fw-bold">

                    Person Name

                </label>


                <input type="text"
                       name="person_name"
                       class="form-control"
                       value="{{ transaction.person_name }}"
                       required>


            </div>





            <!-- TYPE -->


            <div class="mb-3">


                <label class="form-label fw-bold">

                    Transaction Type

                </label>


                <select name="type"
                        class="form-select"
                        required>


                    <option value="expense"
                    {% if transaction.type == "expense" %}
                        selected
                    {% endif %}>

                        Expense (-)

                    </option>



                    <option value="income"
                    {% if transaction.type == "income" %}
                        selected
                    {% endif %}>

                        Income (+)

                    </option>


                </select>


            </div>






            <!-- AMOUNT -->


            <div class="mb-3">


                <label class="form-label fw-bold">

                    Amount

                </label>


                <div class="input-group">


                    <span class="input-group-text">

                        $

                    </span>


                    <input type="number"
                           step="0.01"
                           name="amount"
                           class="form-control"
                           value="{{ transaction.amount }}"
                           required>


                </div>


            </div>







            <!-- ITEM -->


            <div class="mb-3">


                <label class="form-label fw-bold">

                    Item

                </label>


                <input type="text"
                       name="item"
                       class="form-control"
                       value="{{ transaction.item or '' }}">


            </div>







            <!-- NOTE -->


            <div class="mb-3">


                <label class="form-label fw-bold">

                    Note

                </label>


                <textarea name="note"
                          class="form-control"
                          rows="3">{{ transaction.note or '' }}</textarea>


            </div>







            <!-- DATE DISPLAY -->


            {% if transaction.date %}

            <div class="mb-3">


                <label class="form-label fw-bold">

                    Created Date

                </label>


                <input type="text"
                       class="form-control"
                       value="{{ transaction.date.strftime('%Y-%m-%d') }}"
                       readonly>


            </div>

            {% endif %}









            <div class="text-end">


                <a href="{{ url_for('main.person_opening_transactions') }}"
                   class="btn btn-secondary">


                    Cancel


                </a>




                <button type="submit"
                        class="btn btn-primary">


                    <i class="bi bi-save"></i>

                    Update


                </button>



            </div>





        </form>



    </div>




</div>

</div>



</div>



{% endblock %}
