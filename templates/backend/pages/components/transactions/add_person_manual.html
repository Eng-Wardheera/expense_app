{% extends 'backend/home/base.html' %}

{% block title %}
Add Person Manual Transaction
{% endblock %}


{% block content %}

 <!-- [ page-header ] start -->
<div class="page-header">
    <div class="page-header-left d-flex align-items-center">
        <div class="page-header-title">
            <h5 class="m-b-10">Transactions View</h5>
        </div>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item">All Transactions View</li>
        </ul>
    </div>
    <div class="page-header-right ms-auto">
        <div class="page-header-right-items">
            <div class="d-flex d-md-none">
                <a href="javascript:void(0)" class="page-header-right-close-toggle">
                    <i class="feather-arrow-left me-2"></i>
                    <span>Back</span>
                </a>
            </div>
            <div class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                <a href="javascript:void(0);" class="btn btn-icon btn-light-brand" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    <i class="feather-bar-chart"></i>
                </a>
              
                
                <a href="leads-create.html" class="btn btn-primary">
                    <i class="feather-plus me-2"></i>
                    <span>Create Lead</span>
                </a>
            </div>
        </div>
        <div class="d-md-none d-flex align-items-center">
            <a href="javascript:void(0)" class="page-header-right-open-toggle">
                <i class="feather-align-right fs-20"></i>
            </a>
        </div>
    </div>
</div>


<div class="main-content">
<div class="row">
    <div class="card shadow-sm">


        <!-- HEADER -->
        <div class="card-header bg-white py-3">

            <div class="d-flex justify-content-between align-items-center">

                <h5 class="mb-0 fw-bold">

                    Add Person Manual Transaction

                </h5>


                <a href="{{ url_for('main.persons') }}"
                   class="btn btn-outline-secondary btn-sm">

                    <i class="bi bi-arrow-left"></i>

                    Persons

                </a>

            </div>

        </div>




        <!-- BODY -->

        <div class="card-body">


            <form method="POST">


                <!-- PERSON NAME -->

                <div class="mb-3">

                    <label class="form-label fw-bold">

                        Person Name

                    </label>


                    <input type="text"
                           name="person_name"
                           class="form-control"
                           placeholder="Example: Samiro"
                           required>

                </div>





                <!-- TRANSACTION TYPE -->

                <div class="mb-3">


                    <label class="form-label fw-bold">

                        Transaction Type

                    </label>


                    <select name="transaction_type"
                            class="form-select"
                            required>


                        <option value="expense">

                            Expense (-)

                        </option>


                        <option value="income">

                            Income (+)

                        </option>


                    </select>


                </div>





                <!-- AMOUNT -->

                <div class="mb-3">


                    <label class="form-label fw-bold">

                        Amount ($)

                    </label>


                    <input type="number"
                           name="amount"
                           step="0.01"
                           class="form-control"
                           placeholder="0.00"
                           required>


                </div>





                <!-- CATEGORY -->

                <div class="mb-3">


                    <label class="form-label fw-bold">

                        Category

                    </label>


                    <input type="text"
                           name="category"
                           class="form-control"
                           value="Person Payment">


                </div>






                <!-- ITEM -->

                <div class="mb-3">


                    <label class="form-label fw-bold">

                        Item

                    </label>


                    <input type="text"
                           name="item"
                           class="form-control"
                           placeholder="Payment / Withdrawal / Loan">


                </div>






                <!-- NOTE -->

                <div class="mb-3">


                    <label class="form-label fw-bold">

                        Note

                    </label>


                    <textarea name="note"
                              class="form-control"
                              rows="3"
                              placeholder="Details about this payment"></textarea>


                </div>






                <div class="card-footer text-end d-flex justify-content-end" style="gap: 10px;">
                    <a href="{{ url_for('main.persons') }}" class="btn btn-secondary px-4 me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary px-4" id="submitBtn">Save Transaction</button>
                </div>

               
            </form>


        </div>


    </div>
</div>

    


</div>


{% endblock %}
