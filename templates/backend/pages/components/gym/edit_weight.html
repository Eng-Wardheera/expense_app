{% extends 'backend/home/base.html' %}


{% block title %}
Edit Weight
{% endblock %}



{% block content %}


<style>


.weight-card{

    border-radius:25px;

    overflow:hidden;

}



.weight-header{

    background:
    linear-gradient(
        135deg,
        #0d6efd,
        #6610f2
    );

    color:white;

}



.form-control{

    border-radius:15px;

    padding:14px;

}



.icon-box{

    width:90px;

    height:90px;

    border-radius:50%;

    background:#e7f1ff;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:auto;

    font-size:40px;

    color:#0d6efd;

}



.result-card{

    border-radius:20px;

    padding:20px;

    background:#f8f9fa;

    text-align:center;

}



.result-number{

    font-size:25px;

    font-weight:800;

}



.save-btn{

    border-radius:50px;

    padding:14px;

    font-weight:bold;

}



</style>







<div class="page-header">

<div class="page-header-left d-flex align-items-center">


<div class="page-header-title">

<h5 class="m-b-10">

Edit Weight Record

</h5>


</div>


</div>


</div>










<div class="main-content mt-4">


<div class="row justify-content-center">


<div class="col-lg-7">



<div class="card shadow-lg border-0 weight-card">





<div class="card-header weight-header">


<h5 class="mb-0">


<i class="bi bi-pencil-square"></i>


Update Weight Record


</h5>


</div>







<div class="card-body">





<div class="icon-box mb-4">

<i class="bi bi-speedometer2"></i>

</div>







<form method="POST">






<!-- OLD WEIGHT -->


<div class="mb-4">


<label class="fw-bold">

Previous Weight (KG)

</label>


<input

type="text"

class="form-control bg-light fw-bold"

value="{{weight.weight}} KG"

readonly>


</div>









<!-- NEW WEIGHT -->


<div class="mb-4">


<label class="fw-bold">

Current Weight (KG)

</label>


<input

type="number"

step="0.1"

id="currentWeight"

name="weight"

class="form-control"

value="{{weight.weight}}"

required>


</div>









<!-- LIVE CHANGE -->


<div class="row g-3 mb-4">



<div class="col-md-4">


<div class="result-card">


<small>

Old

</small>


<h4 class="fw-bold">

{{weight.weight}}

KG

</h4>


</div>


</div>






<div class="col-md-4">


<div class="result-card">


<small>

Difference

</small>


<h4 
id="difference"
class="result-number text-primary">

0 KG

</h4>


</div>


</div>








<div class="col-md-4">


<div class="result-card">


<small>

Status

</small>


<div id="status">


<span class="badge bg-secondary">

No Change

</span>


</div>


</div>


</div>



</div>









<!-- DATE -->


<div class="mb-4">


<label class="fw-bold">

Date

</label>


<input

type="date"

name="date"

class="form-control"

value="{{weight.date.strftime('%Y-%m-%d')}}"

required>


</div>









<!-- NOTE -->


<div class="mb-4">


<label class="fw-bold">

Note

</label>


<textarea

name="note"

class="form-control"

rows="3"

placeholder="Add note">

{{weight.note if weight.note else ''}}

</textarea>


</div>









<div class="alert alert-info rounded-4">


<i class="bi bi-info-circle"></i>


System automatically detects:

<br>

🔺 Weight Gain

<br>

🔻 Weight Loss

<br>

⚪ No Change


</div>










<button

class="btn btn-primary w-100 save-btn"

type="submit">


<i class="bi bi-save"></i>

Update Weight


</button>






</form>







</div>





</div>



</div>



</div>


</div>









<script>


let oldWeight = Number(
"{{weight.weight}}"
);



let current = document.getElementById(
"currentWeight"
);



let difference = document.getElementById(
"difference"
);



let status = document.getElementById(
"status"
);





current.addEventListener(
"input",
function(){


let newWeight = parseFloat(
this.value
);



if(isNaN(newWeight)){


difference.innerHTML="0 KG";

return;

}





let diff = (
newWeight - oldWeight
).toFixed(1);






if(diff > 0){


difference.innerHTML =
"+"+diff+" KG";


difference.className =
"result-number text-danger";



status.innerHTML=
`

<span class="badge bg-danger">

🔺 Weight Gain

</span>

`;



}




else if(diff < 0){



difference.innerHTML =
diff+" KG";


difference.className =
"result-number text-success";



status.innerHTML=

`

<span class="badge bg-success">

🔻 Weight Loss

</span>

`;



}




else{


difference.innerHTML =
"0 KG";


difference.className =
"result-number text-primary";



status.innerHTML=

`

<span class="badge bg-secondary">

⚪ No Change

</span>

`;



}




});


</script>




{% endblock %}
