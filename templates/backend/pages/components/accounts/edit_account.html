{% extends 'backend/home/base.html' %}

{% block title %}Edit Account{% endblock %}

{% block content %}
 <!-- [ page-header ] start -->
<div class="page-header">
    <div class="page-header-left d-flex align-items-center">
        <div class="page-header-title">
            <h5 class="m-b-10">Accounts </h5>
        </div>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item">Edit Accounts View</li>
        </ul>
    </div>
    <div class="page-header-right ms-auto">
        <div class="page-header-right-items">
            <div class="d-flex d-md-none">
                <a href="javascript:void(0)" class="page-header-right-close-toggle">
                    <i class="feather-arrow-left me-2"></i>
                    <span>Back</span>
                </a>
            </div>
            <div class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                <a href="javascript:void(0);" class="btn btn-icon btn-light-brand" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    <i class="feather-bar-chart"></i>
                </a>
              
                
                <a href="leads-create.html" class="btn btn-primary">
                    <i class="feather-plus me-2"></i>
                    <span>Create Lead</span>
                </a>
            </div>
        </div>
        <div class="d-md-none d-flex align-items-center">
            <a href="javascript:void(0)" class="page-header-right-open-toggle">
                <i class="feather-align-right fs-20"></i>
            </a>
        </div>
    </div>
</div>

<div class="main-content mt-4">
<div class="row">
    <form method="POST">

<div class="card shadow-sm">

    <!-- HEADER -->
    <div class="card-header bg-white">
        <h5 class="mb-0">Edit Account</h5>
    </div>

    <div class="card-body">

        <!-- ACCOUNT NAME -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Account Name</label>

            <div class="col-lg-9">
                <input type="text"
                       name="name"
                       class="form-control"
                       value="{{ account.name }}"
                       required>
            </div>
        </div>

        <!-- TYPE -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Account Type</label>

            <div class="col-lg-9">
                <select name="type" class="form-select">

                    <option value="cash"
                        {% if account.type == "cash" %}selected{% endif %}>
                        Cash
                    </option>

                    <option value="bank"
                        {% if account.type == "bank" %}selected{% endif %}>
                        Bank
                    </option>

                    <option value="mobile"
                        {% if account.type == "mobile" %}selected{% endif %}>
                        Mobile Money
                    </option>

                </select>
            </div>
        </div>

        <!-- BALANCE -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Balance</label>

            <div class="col-lg-9">
                <input type="number"
                       step="0.01"
                       name="balance"
                       class="form-control"
                       value="{{ account.balance }}">
            </div>
        </div>

        <!-- CURRENCY -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Currency</label>

            <div class="col-lg-9">
                <input type="text"
                       name="currency"
                       class="form-control"
                       value="{{ account.currency }}">
            </div>
        </div>

        <!-- STATUS (optional display only) -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Status</label>

            <div class="col-lg-9">
                {% if account.status %}
                    <span class="badge bg-success">Active</span>
                {% else %}
                    <span class="badge bg-danger">Inactive</span>
                {% endif %}
            </div>
        </div>

    </div>

    <!-- FOOTER -->
    <div class="card-footer text-end d-flex justify-content-end" style="gap: 10px;">

        <button type="submit" class="btn btn-primary px-4">
            Update Account
        </button>

        <a href="{{ url_for('main.account_list') }}"
           class="btn btn-secondary px-4">
            Cancel
        </a>

    </div>

</div>

</form>
</div>


</div>

{% endblock %}
