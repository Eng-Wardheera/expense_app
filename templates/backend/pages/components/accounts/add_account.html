{% extends 'backend/home/base.html' %}

{% block title %}Add New Account | Expense Tracker{% endblock %}

{% block content %}
 <!-- [ page-header ] start -->
<div class="page-header">
    <div class="page-header-left d-flex align-items-center">
        <div class="page-header-title">
            <h5 class="m-b-10">Accounts View</h5>
        </div>
        <ul class="breadcrumb">
            <li class="breadcrumb-item"><a href="index.html">Home</a></li>
            <li class="breadcrumb-item">Add Account </li>
        </ul>
    </div>
    <div class="page-header-right ms-auto">
        <div class="page-header-right-items">
            <div class="d-flex d-md-none">
                <a href="javascript:void(0)" class="page-header-right-close-toggle">
                    <i class="feather-arrow-left me-2"></i>
                    <span>Back</span>
                </a>
            </div>
            <div class="d-flex align-items-center gap-2 page-header-right-items-wrapper">
                <a href="javascript:void(0);" class="btn btn-icon btn-light-brand" data-bs-toggle="collapse" data-bs-target="#collapseOne">
                    <i class="feather-bar-chart"></i>
                </a>
              
                
                <a href="leads-create.html" class="btn btn-primary">
                    <i class="feather-plus me-2"></i>
                    <span>Create Lead</span>
                </a>
            </div>
        </div>
        <div class="d-md-none d-flex align-items-center">
            <a href="javascript:void(0)" class="page-header-right-open-toggle">
                <i class="feather-align-right fs-20"></i>
            </a>
        </div>
    </div>
</div>

<div class="main-content">
<div class="row">
    <form method="POST">

<div class="card shadow-sm">

    <div class="card-header bg-white">
        <h5 class="mb-0">Add New Account</h5>
    </div>

    <div class="card-body">

        <!-- ACCOUNT NAME -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Account Name</label>

            <div class="col-lg-9">
                <input type="text" name="name" class="form-control"
                       placeholder="e.g. Main Wallet, Bank, EVC" required>
            </div>
        </div>

        <!-- TYPE -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Account Type</label>

            <div class="col-lg-9">
                <select name="type" class="form-select">
                    <option value="cash">Cash</option>
                    <option value="bank">Bank</option>
                    <option value="mobile">Mobile Money</option>
                </select>
            </div>
        </div>

        <!-- OPENING BALANCE -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Opening Balance</label>

            <div class="col-lg-9">
                <input type="number" step="0.01" name="balance"
                       class="form-control" value="0">
            </div>
        </div>

        <!-- CURRENCY -->
        <div class="row mb-3">
            <label class="col-lg-3 col-form-label fw-bold">Currency</label>

            <div class="col-lg-9">
                <input type="text" name="currency"
                       class="form-control" value="USD">
            </div>
        </div>

    </div>

    <div class="card-footer text-center">
        <button class="btn btn-primary px-4">
            Save Account
        </button>
    </div>

</div>

</form>
</div>


</div>

{% endblock %}
